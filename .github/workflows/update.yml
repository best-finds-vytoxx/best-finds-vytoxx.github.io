name: Mise à jour des articles

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # le premier passage importe tout le canal (2 à 3 h) ; ensuite quelques minutes
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vérifier le robot avant de toucher au site (tests hors ligne)
        run: npm test
      # Détourage : repérage du produit (Grounding DINO) puis BiRefNet, en Python (voir scripts/vision.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Outils de détourage
        run: pip install -r scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: birefnet-general-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-grounding-dino-tiny-v1
      - name: Modèle de détourage
        run: |
          mkdir -p models
          [ -s models/birefnet-general.onnx ] || curl -sSL --retry 3 -o models/birefnet-general.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-general-epoch_244.onnx
          ls -la models
      - name: Lire le canal Telegram
        run: |
          set -o pipefail
          node scripts/scrape.mjs 2>&1 | tee scrape.log
        env:
          BUDGET_MIN: 200   # temps de travail maximal ; ce qui reste est fait au passage suivant
          BIREFNET: models/birefnet-general.onnx
      - name: Relever les clics sur les produits (classement Top du moment)
        run: CLICKS_EVERY_MIN=0 node scripts/clicks.mjs
      - name: Enregistrer les nouveautés
        id: commit
        run: |
          git config user.name "finds-bot"
          git config user.email "finds-bot@users.noreply.github.com"
          git add -A data
          if [ -d images ]; then git add -A images; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Nouveaux articles"
            # main a pu avancer pendant le passage (une modification envoyée entre-temps) : on reprend par-dessus, 3 essais
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs >> scrape.log 2>&1 && git push >> scrape.log 2>&1; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            git status --short | head -20 >> scrape.log
            [ "$ok" = 1 ] || { echo "envoi des nouveautés impossible" | tee -a scrape.log; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Compte rendu du passage (réussi ou non) sur la branche robot-status : lisible sans ouvrir GitHub
      - name: Compte rendu
        if: always()
        run: |
          mkdir -p /tmp/status && cd /tmp/status && git init -q && git checkout -q -b robot-status
          { echo "passage: ${{ github.run_number }} (${{ github.event_name }})"; echo "résultat: ${{ job.status }}"; echo "date: $(date -u +%FT%TZ)"; echo "commit: ${{ github.sha }}"; echo; tail -n 300 "$GITHUB_WORKSPACE/scrape.log" 2>/dev/null; } > status.txt
          git add status.txt && git -c user.name=finds-bot -c user.email=finds-bot@users.noreply.github.com commit -qm "compte rendu ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" robot-status || true

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest apple-touch-icon.png apple-touch-icon-precomposed.png assets data _site/
          if [ -d images ]; then cp -r images _site/; fi
          touch _site/.nojekyll
          # version dans les liens du style et des scripts : les téléphones rechargent la nouvelle version à chaque mise en ligne
          v=$(git rev-parse --short HEAD)
          sed -i "s#assets/style.css\"#assets/style.css?v=$v\"#; s#assets/config.js\"#assets/config.js?v=$v\"#; s#assets/app.js\"#assets/app.js?v=$v\"#" _site/index.html
          grep -n "?v=$v" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
